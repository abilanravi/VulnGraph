name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Verify app imports and routes register
        run: python -c "from app.main import app; assert app.routes; print(f'{len(app.routes)} routes registered')"

      - name: Run tests
        run: pytest -v

      - name: Alembic offline migration check
        run: python -m alembic upgrade head --sql > /dev/null

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Detect committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Backend dependency vulnerability scan
        # Advisory, not blocking: starlette/ecdsa currently have open advisories with no
        # in-scope fix (starlette's fix needs a FastAPI major bump; ecdsa's has no fix version
        # yet) — see README "Known limitations". Direct deps (python-jose, python-multipart)
        # are kept current.
        run: |
          pip install pip-audit
          pip-audit -r backend/requirements.txt
        continue-on-error: true

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Frontend dependency vulnerability scan
        working-directory: frontend
        run: npm audit --audit-level=high
        continue-on-error: true
